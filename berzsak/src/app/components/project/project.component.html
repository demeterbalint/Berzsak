<div class="container" [class.exp-view]="view.status === ViewStatus.EXPERIENCE" [class.sidebar-open]="selectedProject"
     [class.dark-mode]="isDarkMode" #container>

  <!-- brand name -->
  <div class="brand-name">
    <button class="brand-name-button" [class.exp-view]="view.status === ViewStatus.EXPERIENCE" (click)="onBrandClick()">BERZSAK.</button>
  </div>

  <div class="drag-to-explore" [hidden]="selectedProject" *ngIf="view.status === ViewStatus.EXPERIENCE">
    <div class="dte-div">
      <span class="view-icon-dte">
        <img class="drag-icon-light" src="/view-icon/drag-light.png" alt="drag icon">
        <img class="drag-icon-dark" src="/view-icon/drag-dark.png" alt="drag icon">
      </span>
      <span class="drag-text">drag to explore</span>
    </div>
  </div>

  <!-- Grid/Experience button -->
  <div class="view-button" [hidden]="selectedProject" [class.exp-view]="view.status === ViewStatus.EXPERIENCE">
    <button class="view-btn" (click)="viewChange()">
      <span class="view-icon">
        <img class="icon-light" src="/view-icon/grid-light.png" alt="grid icon">
        <img class="icon-dark" src="/view-icon/grid-dark.png" alt="grid icon">
      </span>
      <span class="view-text-exp">{{ view.valueExp }}</span>
      <span class="view-text-grid">{{ view.valueGrid }}</span>
    </button>
  </div>

  <div *ngIf="view.status === ViewStatus.EXPERIENCE" class="contact-div-experience">
    <div class="facebook">
      <a class="fab fa-facebook" target="_blank" href="https://www.facebook.com/irishgreenbycsilla?locale=hu_HU"></a>
    </div>
    <div class="instagram">
      <a class="fab fa-instagram" target="_blank" href="https://www.instagram.com/berzsak_/"></a>
    </div>
    <div class="behance">
      <a class="fab fa-behance" target="_blank" href="https://www.behance.net/berzsak_"></a>
    </div>
    <div class="email">
      <a class="fas fa-envelope"
         (click)="openMail()">
      </a>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar-main-wrapper" *ngIf="selectedProject && !sidebarDisabled" [@sidebarSlide] #sidebar
       (@sidebarSlide.done)="onSidebarAnimDone($event)">
    <div class="fade-div"></div>
    <div class="sidebar-scroll-wrapper">
      <h2 class="sidebar-name">{{ selectedProject.name }}</h2>
      <p class="sidebar-description">{{ selectedProject.shortDescription }}</p>

      <div class="sidebar-main-image">
        <div class="sidebar-gallery-switch-btn">
          <button class="left-btn" (click)="updateSelectedImage(selectedImageIndex-1)"></button>
          <button class="right-btn" (click)="updateSelectedImage(selectedImageIndex+1)"></button>
        </div>
        <img [src]="selectedProject.imageUrls[selectedImageIndex][4]" [alt]="selectedProject.name"
             [srcset]="getSrcset(selectedProject.imageUrls[selectedImageIndex])"
             sizes="34vw"
             [attr.data-project-name]="selectedProject.name">
      </div>

      <div class="gallery">
        <div class="gallery-box" *ngFor="let imgVariants of selectedProject.imageUrls; let i = index"
             (click)="updateSelectedImage(i)"
             [class.active]="selectedImageIndex === i">
          <img
               [src]="imgVariants[4]"
               [srcset]="getSrcset(imgVariants)"
               sizes="{{ getGallerySizes(selectedProject.imageUrls.length) }}"
               [alt]="selectedProject.name">
        </div>
      </div>
      <div class="sidebar-navigate-btn">
        <a (click)="onProjectClick(selectedProject.slug, 'experience')" draggable="false">take me to project</a>
      </div>
    </div>
  </div>
  <button *ngIf="selectedProject" class="close-btn" (click)="closeSidebar()">✕</button>


  <!-- Grid-Experience -->
  <div class="grid-experience-wrapper" *ngIf="view.status === ViewStatus.EXPERIENCE" #gridExp [@gridSlide]="gridState"
       (@gridSlide.done)="onGridAnimDone($event)"
        [class.sidebar-open]="selectedProject">
    <div class="grid-experience">
      <div *ngFor="let project of projects" class="grid-item" [class.dark-mode]="project.name === 'dark-mode'">
        <img *ngIf="project.name !== 'dark-mode'"
             [src]="project.mainImgUrl[4]"
             [srcset]="getSrcset(project.mainImgUrl)"
             [sizes]="gridImageSizes()"
             [alt]="project.name"
             [attr.data-project-name]="project.name"
             (click)="onImageClick($event, project)" draggable="false">
        <img *ngIf="project.name === 'dark-mode'" class="dark-mode-project"
             [src]="themeIcon" [alt]="project.name" draggable="false" (click)="toggleTheme()">
      </div>
    </div>
  </div>

  <!-- Grid-view -->
  <div class="grid-wrapper" *ngIf="view.status === ViewStatus.GRID" #gridCol3>
    <div class="fade-div"></div>
    <div class="grid-col3">
      <div *ngFor="let project of gridProjects" class="grid-item">
        <div class="item-gallery" #itemGallery (click)="onProjectClick(project.slug, 'grid')" [class.dark-mode]="project.name === 'dark-mode'">
          <img *ngFor="let imgVariants of project.imageUrls"
               [src]="imgVariants[4]"
               [srcset]="getSrcset(imgVariants)"
               sizes="(max-width: 400px) 90vw, (max-width: 700px) 40vw, 28vw"
               [alt]="project.name"
               draggable="false">
        </div>
        <a class="col3-navigate-btn" (click)="onProjectClick(project.slug, 'grid')" draggable="false">take me to project</a>
      </div>
    </div>

    <hr>

    <div class="contact-div">
      <div class="facebook">
        <a class="fab fa-facebook" target="_blank" href="https://www.facebook.com/irishgreenbycsilla?locale=hu_HU"></a>
      </div>
      <div class="instagram">
        <a class="fab fa-instagram" target="_blank" href="https://www.instagram.com/berzsak_/"></a>
      </div>
      <div class="behance">
        <a class="fab fa-behance" target="_blank" href="https://www.behance.net/berzsak_"></a>
      </div>
      <div class="email">
        <a class="fas fa-envelope"
           (click)="openMail()">
        </a>
      </div>
    </div>
  </div>

</div>
