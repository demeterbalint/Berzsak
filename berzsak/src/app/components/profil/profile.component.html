<div class="container" [class.dark-mode]="isDarkMode">
  <div class="brand-name">
    <button class="brand-name-button" (click)="onBrandClick()">BERZSAK.</button>
  </div>

  <div class="navigate-back-btn">
    <a [routerLink]="['/berzsak']">take me back</a>
  </div>

  <div class="profile-grid">
    <img src="{{ project.imageUrls[0][4] }}"
         srcset="{{ getSrcset(project.imageUrls[0]) }}"
         sizes=window.innerWidth*0.8*0.4
         alt="profile pic">
    <div class="selectable profile-description">
      <h1>hello,</h1>
      <p [innerHTML]="aboutMe"></p>
    </div>
  </div>

  <hr>

  <div class="contact-div">
    <div class="facebook">
      <a class="fab fa-facebook" target="_blank" href="https://www.facebook.com/berzsak/"></a>
    </div>
    <div class="instagram">
      <a class="fab fa-instagram" target="_blank" href="https://www.instagram.com/berzsak_/"></a>
    </div>
    <div class="behance">
      <a class="fab fa-behance" target="_blank" href="https://www.behance.net/berzsak_"></a>
    </div>
    <div class="email">
      <a class="fas fa-envelope"
         (click)="openMail()">
      </a>
    </div>
  </div>
</div>
